[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqtpass"
dynamic = ["version"]
description = "A cross-platform GUI for pass, the standard Unix password manager; a Python port of QtPass"
readme = "README.md"
# The code is GPL; the wheel also ships the logo (WTFPL) and the Lato font
# (OFL-1.1). REUSE.toml says which file has which licence.
license = "GPL-3.0-or-later AND WTFPL AND OFL-1.1"
license-files = [
    "LICENSE",
    "LICENSES/GPL-3.0-or-later.txt",
    "LICENSES/OFL-1.1.txt",
    "LICENSES/WTFPL.txt",
]
requires-python = ">=3.11"
authors = [{ name = "Anne Jan Brouwer" }]
keywords = ["pass", "password manager", "password-store", "gpg", "qt", "qtpass"]
dependencies = ["PyQt6>=6.8", "Markdown>=3.5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/annejan/PyQtPass"
Source = "https://github.com/annejan/PyQtPass"
Issues = "https://github.com/annejan/PyQtPass/issues"
Changelog = "https://github.com/annejan/PyQtPass/blob/main/CHANGELOG.md"

[project.gui-scripts]
pyqtpass = "pyqtpass.main_window:main"

[tool.setuptools.dynamic]
version = { attr = "pyqtpass.__version__" }

[tool.setuptools.packages.find]
include = ["pyqtpass*"]

[tool.setuptools.package-data]
pyqtpass = [
    "artwork/*.png",
    "artwork/*.svg",
    "artwork/*.ico",
    "artwork/*.icns",
    "artwork/fonts/*",
    "localization/*.qm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pyqtpass"]
branch = true

[tool.coverage.report]
skip_empty = true

[tool.black]
target-version = ["py311"]
