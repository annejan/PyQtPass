<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>PyQtPass</title>
  <defs>
    <linearGradient id="shackle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d5bb8"/>
      <stop offset="0.45" stop-color="#4d9bf5"/>
      <stop offset="1" stop-color="#123f8a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8ff2"/>
      <stop offset="0.55" stop-color="#1c5cc0"/>
      <stop offset="1" stop-color="#0c357d"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="well" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#123f86"/>
      <stop offset="1" stop-color="#071d45"/>
    </radialGradient>
  </defs>

  <!-- shackle -->
  <path d="M362 480V270a150 150 0 0 1 300 0v210" fill="none" stroke="#0a2a66" stroke-width="104"/>
  <path d="M362 480V270a150 150 0 0 1 300 0v210" fill="none" stroke="url(#shackle)" stroke-width="80"/>
  <path d="M342 300a170 170 0 0 1 110-150" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="16" stroke-linecap="round"/>

  <!-- heart shaped body -->
  <path id="heart" d="M512 966C330 840 120 690 120 500c0-118 92-206 210-206 82 0 144 40 182 104 38-64 100-104 182-104 118 0 210 88 210 206 0 190-210 340-392 466z"
        fill="url(#body)" stroke="#0a2a66" stroke-width="20" stroke-linejoin="round"/>
  <path d="M512 914C352 802 170 668 170 504c0-90 70-160 162-160 74 0 128 42 158 106h44c30-64 84-106 158-106 92 0 162 70 162 160 0 164-182 298-342 410z"
        fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="8" stroke-linejoin="round"/>
  <path d="M180 470c10-80 74-134 150-134 70 0 120 36 160 100-120-30-210-10-310 34z" fill="url(#gloss)"/>

  <!-- the Python snakes -->
  <circle cx="512" cy="600" r="166" fill="url(#well)" stroke="#5aa6f5" stroke-opacity="0.7" stroke-width="10"/>
  <g transform="translate(512 600)" stroke-linejoin="round">
    <path d="M-44-100H28V-16H-60V64H-100V-52H-44z" fill="#3d86e3" stroke="#3d86e3" stroke-width="20"/>
    <path d="M44 100H-28V16H60V-64H100V52H44z" fill="#ffcc2e" stroke="#ffcc2e" stroke-width="20"/>
    <circle cx="-22" cy="-78" r="10" fill="#ffffff"/>
    <circle cx="22" cy="78" r="10" fill="#ffffff"/>
  </g>
</svg>
