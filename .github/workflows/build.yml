name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like v0.3.0. An existing tag is built as it is; otherwise the tag is made on the commit this runs on'
        required: true

permissions:
  contents: write
  actions: read

# Every action is pinned to a commit; the comment names its release.
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Check the version
      id: tag
      env:
        REQUESTED: ${{ inputs.version || github.ref_name }}
      run: |
        if ! [[ "$REQUESTED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::'$REQUESTED' is not a version like v0.3.0"
          exit 1
        fi
        if git rev-parse -q --verify "refs/tags/$REQUESTED" >/dev/null; then
          # An existing tag is released as it is, from its own commit.
          git checkout -q "refs/tags/$REQUESTED"
        fi
        VERSION_FILE=pyqtpass/__init__.py
        CODE_VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' "$VERSION_FILE")
        if [ "v$CODE_VERSION" != "$REQUESTED" ]; then
          echo "::error::$VERSION_FILE says $CODE_VERSION, not ${REQUESTED#v}"
          exit 1
        fi
        echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT"
        echo "version=$CODE_VERSION" >> "$GITHUB_OUTPUT"
    - name: Release notes from the changelog
      env:
        VERSION: ${{ steps.tag.outputs.version }}
      run: |
        awk -v heading="## $VERSION" '
          $0 == heading { found = 1; next }
          found && /^## / { exit }
          found { print }
        ' CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then
          echo "See CHANGELOG.md." > release-notes.md
        fi
        cat >> release-notes.md <<'NOTES'

        ### Downloads

        Each file is listed in `SHA256SUMS`. A signed build provenance
        attestation records the workflow run and commit that produced them:
        `gh attestation verify <file> --repo annejan/PyQtPass`.
        NOTES
    - name: Create the release and its tag
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: PyQtPass ${{ steps.tag.outputs.tag }}
        body_path: release-notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: release
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/tags/${{ needs.release.outputs.tag }}
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
        architecture: 'x64'
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Setup Qt environment
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        version: '6.8.3'
    - name: Compile translations
      shell: bash
      run: lrelease -silent pyqtpass/localization/*.ts
    - name: Install UPX
      run: |
        Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-win64.zip" -OutFile "upx.zip"
        Expand-Archive "upx.zip" -DestinationPath "upx"
        echo "${{ github.workspace }}\upx" >> $env:GITHUB_PATH
    - name: Build with PyInstaller
      run: pyinstaller PyQtPass.spec
    - name: Name the program
      shell: bash
      run: |
        mkdir out
        mv dist/PyQtPass.exe "out/PyQtPass-${{ needs.release.outputs.version }}-windows-x64.exe"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: windows
        path: out/

  build-mac:
    needs: release
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/tags/${{ needs.release.outputs.tag }}
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Setup Qt environment
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        version: '6.8.3'
    - name: Compile translations
      run: lrelease -silent pyqtpass/localization/*.ts
    - name: Build with PyInstaller
      run: pyinstaller PyQtPass.spec
    - name: Create DMG
      run: |
        # The disk image holds the app and a link to Applications.
        mkdir -p dist/dmg out
        cp -R dist/PyQtPass.app dist/dmg/
        ln -s /Applications dist/dmg/Applications
        hdiutil create -volname PyQtPass -srcfolder dist/dmg -ov -format UDZO \
          "out/PyQtPass-${{ needs.release.outputs.version }}-macos-$(uname -m).dmg"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: macos
        path: out/

  build-linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/tags/${{ needs.release.outputs.tag }}
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - name: Install system libraries for PyQt6
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Setup Qt environment
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        version: '6.8.3'
    - name: Compile translations
      run: lrelease -silent pyqtpass/localization/*.ts
    - name: Build the single-file program
      run: |
        pyinstaller PyQtPass.spec
        mkdir out
        mv dist/PyQtPass "out/PyQtPass-${{ needs.release.outputs.version }}-linux-x86_64"
    - name: Build the AppImage
      if: hashFiles('packaging/linux/build-appimage.sh') != ''
      run: |
        rm -rf build dist
        PYQTPASS_ONEDIR=1 pyinstaller PyQtPass.spec
        packaging/linux/build-appimage.sh "${{ needs.release.outputs.version }}"
        mv dist/*.AppImage out/
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: linux
        path: out/

  publish:
    needs: [release, build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: out
        merge-multiple: true
    - name: Checksums
      working-directory: out
      run: |
        sha256sum -- * > SHA256SUMS
        cat SHA256SUMS
    - name: Attest build provenance
      id: attest
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: 'out/PyQtPass-*'
    - name: Attach the provenance bundle
      run: cp "${{ steps.attest.outputs.bundle-path }}" "out/PyQtPass-${{ needs.release.outputs.version }}.intoto.jsonl"
    - name: Upload to the release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ needs.release.outputs.tag }}
        files: out/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
