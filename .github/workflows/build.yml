name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like v0.3.0. An existing tag is built as it is; otherwise the tag is made on the commit this runs on'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Check the version
      id: tag
      env:
        REQUESTED: ${{ inputs.version || github.ref_name }}
      run: |
        if ! [[ "$REQUESTED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::'$REQUESTED' is not a version like v0.3.0"
          exit 1
        fi
        if git rev-parse -q --verify "refs/tags/$REQUESTED" >/dev/null; then
          # An existing tag is released as it is, from its own commit.
          git checkout -q "refs/tags/$REQUESTED"
        fi
        CODE_VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' pyqtpass.py)
        if [ "v$CODE_VERSION" != "$REQUESTED" ]; then
          echo "::error::pyqtpass.py says $CODE_VERSION, not ${REQUESTED#v}"
          exit 1
        fi
        echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT"
    - name: Release notes from the changelog
      env:
        TAG: ${{ steps.tag.outputs.tag }}
      run: |
        awk -v heading="## ${TAG#v}" '
          $0 == heading { found = 1; next }
          found && /^## / { exit }
          found { print }
        ' CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then
          echo "See CHANGELOG.md." > release-notes.md
        fi
    - name: Create the release and its tag
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: PyQtPass ${{ steps.tag.outputs.tag }}
        body_path: release-notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows64:
    needs: release
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: refs/tags/${{ needs.release.outputs.tag }}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        architecture: 'x64'
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Setup Qt environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
    - name: Compile translations
      # lrelease-pro is not on the PATH with Qt 6 on Linux and macOS.
      shell: bash
      run: lrelease -silent localization/*.ts
    - name: Install UPX
      run: |
        Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-win64.zip" -OutFile "upx.zip"
        Expand-Archive "upx.zip" -DestinationPath "upx"
        echo "${{ github.workspace }}\upx" >> $env:GITHUB_PATH
    - name: Build with PyInstaller
      run: pyinstaller PyQtPass.spec
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: PyQtPass-Windows64
        path: dist/
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.release.outputs.tag }}
        files: ./dist/PyQtPass.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    needs: release
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: refs/tags/${{ needs.release.outputs.tag }}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Setup Qt environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
    - name: Compile translations
      # lrelease-pro is not on the PATH with Qt 6 on Linux and macOS.
      shell: bash
      run: lrelease -silent localization/*.ts
    - name: Build with PyInstaller
      run: pyinstaller PyQtPass.spec
    - name: Create DMG
      run: |
        # The disk image holds the app and a link to Applications.
        mkdir -p dist/dmg
        cp -R dist/PyQtPass.app dist/dmg/
        ln -s /Applications dist/dmg/Applications
        hdiutil create -volname PyQtPass -srcfolder dist/dmg -ov -format UDZO dist/PyQtPass.dmg
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: PyQtPass-macOS
        path: dist/PyQtPass.dmg
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.release.outputs.tag }}
        files: ./dist/PyQtPass.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: refs/tags/${{ needs.release.outputs.tag }}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install system libraries for PyQt6
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Setup Qt environment
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
    - name: Compile translations
      # lrelease-pro is not on the PATH with Qt 6 on Linux and macOS.
      shell: bash
      run: lrelease -silent localization/*.ts
    - name: Build with PyInstaller
      run: pyinstaller PyQtPass.spec
    - name: Rename to PyQtPass-linux
      run: mv dist/PyQtPass dist/PyQtPass-linux
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: PyQtPass-Linux
        path: dist/PyQtPass-linux
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.release.outputs.tag }}
        files: ./dist/PyQtPass-linux
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
