name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like v0.3.0. An existing tag is built as it is; otherwise the tag is made on the commit this runs on'
        required: true
      dry_run:
        description: 'Only build, from the commit this runs on: no tag, no release, no attestation'
        type: boolean
        default: false

permissions:
  contents: read

# One run per version at a time; a second one waits instead of racing it.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# Every action is pinned to a commit; the comment names its release.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Check the version
      id: tag
      env:
        REQUESTED: ${{ inputs.version || github.ref_name }}
        DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      run: |
        # A release is made from reviewed code only; a dry run may build
        # any branch.
        if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
            && [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "::error::Releases are made from main, not $GITHUB_REF; use dry_run to build other branches"
          exit 1
        fi
        if ! [[ "$REQUESTED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::'$REQUESTED' is not a version like v0.3.0"
          exit 1
        fi
        if [ "$DRY_RUN" != "true" ] && git rev-parse -q --verify "refs/tags/$REQUESTED" >/dev/null; then
          # An existing tag is released as it is, from its own commit.
          git checkout -q "refs/tags/$REQUESTED"
        fi
        VERSION_FILE=pyqtpass/__init__.py
        CODE_VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' "$VERSION_FILE")
        if [ "v$CODE_VERSION" != "$REQUESTED" ]; then
          echo "::error::$VERSION_FILE says $CODE_VERSION, not ${REQUESTED#v}"
          exit 1
        fi
        echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT"
        echo "version=$CODE_VERSION" >> "$GITHUB_OUTPUT"
    - name: Release notes from the changelog
      env:
        VERSION: ${{ steps.tag.outputs.version }}
      run: |
        awk -v heading="## $VERSION" '
          $0 == heading { found = 1; next }
          found && /^## / { exit }
          found { print }
        ' CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then
          echo "See CHANGELOG.md." > release-notes.md
        fi
        cat >> release-notes.md <<'NOTES'

        ### Downloads

        Each file is listed in `SHA256SUMS`. A signed build provenance
        attestation records the workflow run and commit that produced them:
        `gh attestation verify <file> --repo annejan/PyQtPass`. Each file
        also has the maintainer's GnuPG signature: `gpg --verify <file>.asc`.
        NOTES
    # The release starts as a draft: nothing is public until the maintainer
    # has looked at it, signed the files (scripts/sign-release-assets.sh)
    # and published it. A draft does not make its tag, so the tag is made
    # here first; the build jobs check it out.
    - name: Create the tag and the draft release
      if: ${{ !inputs.dry_run }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ steps.tag.outputs.tag }}
      run: |
        if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
        fi
        if ! gh release view "$TAG" >/dev/null 2>&1; then
          gh release create "$TAG" --draft --verify-tag \
            --title "PyQtPass $TAG" --notes-file release-notes.md
        fi

  build-windows:
    needs: release
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.dry_run && github.sha || format('refs/tags/{0}', needs.release.outputs.tag) }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
        architecture: 'x64'
    - name: Install dependencies
      run: |
        pip install -r requirements-build.txt
    - name: Setup Qt environment
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        version: '6.8.3'
    - name: Compile translations
      shell: bash
      run: lrelease -silent pyqtpass/localization/*.ts
    - name: Build with PyInstaller
      run: pyinstaller PyQtPass.spec
    - name: Name the program
      shell: bash
      run: |
        mkdir out
        mv dist/PyQtPass.exe "out/PyQtPass-${{ needs.release.outputs.version }}-windows-x64.exe"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: windows
        path: out/

  build-mac:
    needs: release
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.dry_run && github.sha || format('refs/tags/{0}', needs.release.outputs.tag) }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        pip install -r requirements-build.txt
    - name: Setup Qt environment
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        version: '6.8.3'
    - name: Compile translations
      run: lrelease -silent pyqtpass/localization/*.ts
    - name: Build with PyInstaller
      run: pyinstaller PyQtPass.spec
    - name: Create DMG
      run: |
        # The disk image holds the app and a link to Applications.
        mkdir -p dist/dmg out
        cp -R dist/PyQtPass.app dist/dmg/
        ln -s /Applications dist/dmg/Applications
        hdiutil create -volname PyQtPass -srcfolder dist/dmg -ov -format UDZO \
          "out/PyQtPass-${{ needs.release.outputs.version }}-macos-$(uname -m).dmg"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: macos
        path: out/

  build-linux:
    needs: release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.dry_run && github.sha || format('refs/tags/{0}', needs.release.outputs.tag) }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Install system libraries for PyQt6
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1
    - name: Install dependencies
      run: |
        pip install -r requirements-build.txt
    - name: Setup Qt environment
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        version: '6.8.3'
    - name: Compile translations
      run: lrelease -silent pyqtpass/localization/*.ts
    - name: Build the single-file program
      run: |
        pyinstaller PyQtPass.spec
        mkdir out
        mv dist/PyQtPass "out/PyQtPass-${{ needs.release.outputs.version }}-linux-x86_64"
    - name: Build the AppImage
      if: hashFiles('packaging/linux/build-appimage.sh') != ''
      run: |
        rm -rf build dist
        PYQTPASS_ONEDIR=1 pyinstaller PyQtPass.spec
        packaging/linux/build-appimage.sh "${{ needs.release.outputs.version }}"
        mv dist/*.AppImage out/
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: linux
        path: out/

  publish:
    needs: [release, build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.dry_run && github.sha || format('refs/tags/{0}', needs.release.outputs.tag) }}
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: out
        merge-multiple: true
    # GitHub's own "Source code" downloads are made on the fly and can
    # change, so they cannot be attested or signed; these can.
    - name: Source archives
      env:
        VERSION: ${{ needs.release.outputs.version }}
      run: |
        git archive --format=tar.gz --prefix="PyQtPass-$VERSION/" \
          -o "out/PyQtPass-$VERSION.tar.gz" HEAD
        git archive --format=zip --prefix="PyQtPass-$VERSION/" \
          -o "out/PyQtPass-$VERSION.zip" HEAD
    - name: Checksums
      working-directory: out
      run: |
        sha256sum -- * > SHA256SUMS
        cat SHA256SUMS
    # A published release is left alone: its files may already be signed
    # and downloaded, and new bytes under the same names would not match.
    # So is a draft the maintainer has signed (re-pushing a signed tag runs
    # this again): the old signatures would not match the new files.
    - name: Check that the release is still an unsigned draft
      if: ${{ !inputs.dry_run }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.release.outputs.tag }}
      run: |
        if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
          echo "::error::$TAG is already published; its files are not replaced"
          exit 1
        fi
        signed="$(gh release view "$TAG" --json assets \
          --jq '[.assets[].name | select(endswith(".asc"))] | length')"
        if [ "$signed" != "0" ]; then
          echo "::error::$TAG already has signed files; its files are not replaced. Delete the release's .asc files to rebuild it."
          exit 1
        fi
    - name: Attest build provenance
      if: ${{ !inputs.dry_run }}
      id: attest
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: 'out/PyQtPass-*'
    - name: Attach the provenance bundle
      if: ${{ !inputs.dry_run }}
      run: cp "${{ steps.attest.outputs.bundle-path }}" "out/PyQtPass-${{ needs.release.outputs.version }}.intoto.jsonl"
    - name: Upload to the draft release
      if: ${{ !inputs.dry_run }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.release.outputs.tag }}
      run: |
        gh release upload "$TAG" --clobber out/*
        {
          echo "Draft release $TAG is ready: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
          echo
          echo "Sign the files with \`scripts/sign-release-assets.sh $TAG\`, then publish it."
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Keep the dry run's files
      if: ${{ inputs.dry_run }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-dry-run
        path: out/
