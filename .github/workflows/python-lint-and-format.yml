name: Python Lint, Format and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.13' ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system libraries for PyQt6, GnuPG, Git and pass
      run: |
        # PyQt6 needs these shared libraries present for pylint to import it
        # and introspect; unlike PyQt5 it cannot even be imported without them.
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1 gnupg git pass qt6-l10n-tools

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Pylint
      run: |
        # Lint every tracked Python file, the tests included
        pylint $(git ls-files '*.py')

    - name: Check code formatting with Black
      run: |
        # Check if the codebase follows Black's style
        black --check .

    - name: Compile translations
      run: |
        /usr/lib/qt6/bin/lrelease -silent pyqtpass/localization/*.ts

    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m pytest -v --cov=pyqtpass --cov-report=term-missing:skip-covered --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"
