name: Python Lint, Format and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.13' ]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system libraries for PyQt6, GnuPG, Git and pass
      run: |
        # PyQt6 needs these shared libraries present for pylint to import it
        # and introspect; unlike PyQt5 it cannot even be imported without them.
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1 gnupg git pass

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Pylint
      run: |
        # Lint every tracked Python file, the tests included
        pylint $(git ls-files '*.py')

    - name: Check code formatting with Black
      run: |
        # Check if the codebase follows Black's style
        black --check .

    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m pytest -v
