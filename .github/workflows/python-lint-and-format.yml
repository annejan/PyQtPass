name: Python Lint, Format and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.13' ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system libraries for PyQt6, GnuPG, Git and pass
      run: |
        # PyQt6 needs these shared libraries present for pylint to import it
        # and introspect; unlike PyQt5 it cannot even be imported without them.
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1 gnupg git pass qt6-l10n-tools

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Pylint
      run: |
        # Lint every tracked Python file, the tests included
        pylint $(git ls-files '*.py')

    - name: Check code formatting with Black
      run: |
        # Check if the codebase follows Black's style
        black --check .

    - name: Compile translations
      run: |
        /usr/lib/qt6/bin/lrelease -silent pyqtpass/localization/*.ts

    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m pytest -v --cov --cov-report=term-missing:skip-covered --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"

    # The PR comment is posted by coverage-comment.yml, which runs after
    # this workflow with the write access a pull request's own run lacks.
    - name: Prepare the coverage comment
      if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        mkdir coverage-comment
        echo "$PR_NUMBER" > coverage-comment/pr-number
        TOTAL=$(python -m coverage report --format=total)
        {
          echo "<!-- pyqtpass-coverage -->"
          echo "### Test coverage: ${TOTAL}%"
          echo
          echo "Lines and branches of \`pyqtpass\` run by the tests on Python ${{ matrix.python-version }}, at ${{ github.event.pull_request.head.sha }}."
          echo
          echo "<details><summary>Coverage per file</summary>"
          echo
          python -m coverage report --format=markdown
          echo
          echo "</details>"
        } > coverage-comment/comment.md
    - name: Upload the coverage comment
      if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-comment
        path: coverage-comment/
